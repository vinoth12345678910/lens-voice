[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lensvoice"
version = "0.1.0"
description = "LensVoice runtime: laptop-only AI accessibility assistant for blind users (perception pipeline skeleton)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]